<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pathline – ניהול פרויקטים לצוות</title>
<meta name="description" content="כלי לניהול פרויקטים לצוות: נתיב קריטי, לוח משימות אישי לכל עובד, תמונת מצב למנהל, תזכורות, הודעות וקופיילוט.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, exact working tool for an Israeli project team; the manager's control room.
   IDEA: a survey map; the critical path is the magenta route, each person a marked trail.
   PICTURE: health score and live forecast for the manager, a personal board for each employee, a right-to-left Gantt.
   COLOUR and TYPE: sea band, paper land, magenta route, contour-brown float; Rubik.
   LAYOUT: headline finding and KPIs on the sea band, role-based tabs, copilot drawer on the side. */
:root{color-scheme:light dark;
--bg:light-dark(#fbfbf2,#0d1c24);--ink:light-dark(#13242e,#e4ecee);--soft:light-dark(#4d5f68,#9fb2b9);
--sea:light-dark(#bfe3ee,#143545);--sea2:light-dark(#3f8fa9,#5fb3cc);--line:light-dark(#dcd8c6,#28434f);
--brown:light-dark(#a8551b,#d9925c);--mag:light-dark(#d6127e,#ff4fa8);--card:light-dark(#ffffff,#112631);
--med:light-dark(#f2d9c0,#4d3424);--low:light-dark(#e3f2f7,#183f50);
--bad:light-dark(#c62828,#ff6b6b);--warn:light-dark(#b86e00,#f0a73a);--warnbg:light-dark(#fde9c4,#4a3510);--good:light-dark(#2e7d4f,#5cc58a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Rubik,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.2vw,44px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--sea);padding-bottom:18px}
.bar1{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:800;font-size:15px;color:var(--mag);margin-inline-end:4px}
input,select,textarea,button{font:inherit;font-size:16px;color:var(--ink)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--mag);flex:none}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--mag)}
:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
#pname{flex:1 1 220px;width:auto;font-weight:700;background:transparent;border-color:transparent;font-size:18px}
#pname:hover,#pname:focus{background:var(--card);border-color:var(--line)}
.pn{flex:1 1 220px;font-weight:700;font-size:18px}
.lbl{font-size:14px;color:var(--soft);display:flex;align-items:center;gap:8px;white-space:nowrap}
.lbl select{width:auto;min-width:130px}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:0 7px;line-height:20px;min-width:20px;text-align:center}
.badge:empty{display:none}
h1{font-size:clamp(26px,3.8vw,42px);line-height:1.12;font-weight:800;margin:20px 0 8px;text-wrap:balance}
.sub{margin:0;font-size:17px;max-width:75ch}
.demo{margin:16px 0 0;display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 14px;font-size:14px}
.demo b{color:var(--mag);font-weight:700}
.sub b{color:var(--bad);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.k{background:var(--bg);border-radius:12px;padding:12px 14px}
.k span{display:block;font-size:13px;color:var(--soft)}
.k b{font-size:clamp(22px,2.6vw,28px);font-weight:800;white-space:nowrap}
.k b.bad{color:var(--bad)}.k b.good{color:var(--good)}.k b.mid{color:var(--warn)}
.k small{display:block;font-size:13px;color:var(--soft)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tabs button{min-height:44px;padding:0 18px;border-radius:999px;border:0;color:var(--ink);font-weight:500;background:var(--bg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-current=page]{background:var(--ink);color:var(--bg)}
h2{font-size:22px;font-weight:800;margin:0}
h3{font-size:17px;margin:0 0 8px;font-weight:700}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:14px;color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.g2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.g3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-top:16px}
.empty{padding:24px;text-align:center;color:var(--soft)}
/* health */
.hs{display:flex;gap:16px;align-items:center}
.hsn{font-size:64px;font-weight:800;line-height:1;color:var(--good)}
.hsn.mid{color:var(--warn)}.hsn.bad{color:var(--bad)}
.hl1{font-size:20px;font-weight:700}
.drv{list-style:none;padding:0;margin:12px 0 0}
.drv li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.drv li span:last-child{color:var(--bad);font-weight:700;white-space:nowrap}
.cmpb{margin-top:14px;display:grid;gap:6px;font-size:14px}
.cmpb>div{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:8px;align-items:center}
.cmpb>div>span:last-child{text-align:end;font-weight:700}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sea2);border-radius:4px}
.pbar i.pl{background:var(--soft)}.pbar i.bad{background:var(--bad)}
/* alerts */
.al{list-style:none;padding:0;margin:8px 0 0}
.al li{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.al li .row{margin-top:2px}
.al .lv{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-inline-end:8px}
.al .high .lv{background:var(--bad)}
/* team */
.team{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.mc{display:grid;gap:10px;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:var(--ink)}
.mc:hover{border-color:var(--sea2)}
.mh{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;line-height:1;color:#fff;font-weight:700;font-size:15px;flex:none}
.av.lg{width:52px;height:52px;font-size:22px}
.av.sm{width:26px;height:26px;font-size:12px}
.ms{font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 10px}
.ms b{color:var(--bad);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--low);white-space:nowrap;font-weight:500}
.chip.bad{background:var(--bad);color:#fff}.chip.warn{background:var(--warnbg)}.chip.crit{background:transparent;border:1px solid var(--mag);color:var(--mag);padding:1px 8px}.chip.ok{background:var(--sea)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
/* heat */
.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:500;color:var(--soft);white-space:nowrap;padding:2px 4px;border:0;font-size:12px}
.heat td{border:0;padding:0}
.heat .c{display:block;min-width:38px;height:30px;border-radius:6px;text-align:center;line-height:30px;background:var(--low);font-variant-numeric:tabular-nums}
.heat .l0{background:transparent;border:1px dashed var(--line);color:var(--soft)}
.heat .l2{background:var(--sea);}.heat .l3{background:var(--bad);color:#fff;font-weight:700}
.heat .now{outline:2px solid var(--ink)}
.scroll{overflow-x:auto}
/* lists */
.fl-l,.act{list-style:none;padding:0;margin:8px 0 0}
.fl-l li,.act li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.fl-l li.due{color:var(--bad)}
.act .t{font-size:14px}.act .t q{display:block;color:var(--soft);quotes:none}
.grow{flex:1}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--low);border-radius:14px;padding:10px;min-height:160px}
.col h3{display:flex;justify-content:space-between;font-size:15px;margin:2px 4px 4px}
.col h3 span{color:var(--soft);font-weight:500}
.kc{display:grid;gap:8px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;cursor:pointer;font:inherit;color:var(--ink)}
.kc:hover{border-color:var(--sea2)}
.kt{font-weight:500;line-height:1.35}.kt small{color:var(--soft);font-weight:400;margin-inline-end:4px}
.km{font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:6px}
/* gantt */
.gantt{display:grid;grid-template-columns:minmax(120px,250px) minmax(0,1fr)}
.gl{padding-top:28px}
.gr{height:34px;display:flex;align-items:center;gap:8px;font-size:14px;padding-inline-end:8px}
.gr span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr.c span:last-child{color:var(--mag);font-weight:700}
.gid{flex:none;width:24px;font-size:13px;color:var(--soft);text-align:center}
.gt{position:relative;min-height:80px}
.gt svg{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
.tk{stroke:var(--line)}.tl{fill:var(--soft);font:12px Rubik,sans-serif}
.rowbg{fill:var(--sea);opacity:.28}
.b{fill:var(--sea2)}.b.c{fill:var(--mag)}.pg{fill:#000;opacity:.28}
.anim .b,.anim .pg{transform-box:fill-box;transform-origin:right;animation:grow .7s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.anim .b,.anim .pg{animation:none}}
.fl{stroke:var(--brown);stroke-width:2;stroke-dasharray:3 3}
.lk{stroke:var(--soft);fill:none;opacity:.55}.lk.c{stroke:var(--mag);opacity:.9}
.rk{fill:var(--card);stroke:var(--bad);stroke-width:2}
.td{stroke:var(--ink);stroke-width:2}.tdt{fill:var(--ink);font:700 12px Rubik,sans-serif}
.wib{stroke:var(--ink);stroke-width:2}.bl{stroke:var(--soft);stroke-width:2;stroke-dasharray:6 4}.blt{fill:var(--soft);font:500 12px Rubik,sans-serif}
.lg{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--soft);margin-top:12px}
.lg i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.wi{margin-bottom:16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center}
.wi .row{flex-wrap:nowrap}.wi select{flex:1 1 auto}
.stp{display:flex;align-items:center;gap:6px;flex:none}.stp input{width:72px;text-align:center}.stp button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:20px}
.wir{font-size:16px;background:var(--bg);border-radius:12px;padding:14px 16px;min-height:76px}.wir b{font-size:19px}.wir b.up{color:var(--bad)}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--soft);font-weight:500;text-align:start;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
td input,td select{min-height:40px;padding:6px 8px}
.w-d{width:72px}.w-id{width:34px}.w-s{width:66px}.w-l{width:170px}.w-st{width:110px}.w-o{width:130px}.w-c{width:36px}
.cp{color:var(--mag);font-weight:700;font-size:13px;white-space:nowrap}
.x{width:44px;height:44px;border:0;background:transparent;cursor:pointer;color:var(--soft);font-size:22px;border-radius:8px;flex:none}
.x:hover{color:var(--bad);background:var(--low)}
/* risks */
.rgrid{display:grid;gap:20px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.mx{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:5px;align-items:center}
.mx button{min-height:50px;border:0;border-radius:8px;cursor:pointer;font-weight:800;font-size:18px}
.mx .low{background:var(--low)}.mx .med{background:var(--warnbg)}.mx .high{background:var(--bad);color:#fff}
.mx button.z{font-weight:400;opacity:.55}
.mx button.sel{outline:3px solid var(--ink);outline-offset:1px}
.ax{font-size:13px;color:var(--soft);text-align:center}
.sc{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:800}
.sc.low{background:var(--low)}.sc.med{background:var(--warnbg)}.sc.high{background:var(--bad);color:#fff}
.onp{display:block;font-size:12px;color:var(--mag);font-weight:500;white-space:nowrap;margin-top:2px}
/* messages */
.th{list-style:none;padding:0;margin:8px 0 0}
.th li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.th li.un{background:linear-gradient(to left,var(--low),transparent 70%);padding-inline:10px;border-radius:8px}
.mt{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px}
.mt .note{font-size:13px}
.mtx{white-space:pre-wrap}
details summary{cursor:pointer;color:var(--mag);font-size:14px;min-height:32px;display:inline-flex;align-items:center}
.linkb{border:0;background:none;color:var(--mag);cursor:pointer;font:inherit;font-size:14px;text-decoration:underline;padding:0 4px;min-height:36px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fchips button{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:36px;padding:0 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.fchips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* modal, drawer, pop */
.modal{position:fixed;inset:0;background:rgba(8,18,24,.5);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--bg);border-radius:16px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button.blk[aria-pressed=true]{background:var(--bad);border-color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.facts span{display:block;font-size:12px;color:var(--soft)}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--bg);box-shadow:0 0 50px rgba(0,0,0,.25);z-index:60;display:flex;flex-direction:column}
.drawer[hidden],.pop[hidden]{display:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--sea)}
#copLog{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bub{padding:10px 12px;border-radius:12px;max-width:92%;font-size:15px;line-height:1.55}
.bub.u{background:var(--ink);color:var(--bg);align-self:flex-start}
.bub.a{background:var(--card);border:1px solid var(--line);align-self:flex-end}
.bub.a ul{margin:4px 0;padding-inline-start:18px}
#copChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
#copChips button{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer;font-size:13px}
#copForm{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#copForm textarea{min-height:48px;height:48px}
.pop{position:fixed;top:12px;inset-inline-end:12px;width:min(400px,calc(100% - 24px));max-height:80vh;overflow:auto;z-index:55;box-shadow:0 16px 50px rgba(0,0,0,.25)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
footer{color:var(--soft);font-size:13px}
@media(max-width:900px){.rgrid,.wi,.g2{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--soft)}.stack td:empty{display:none}.w-d,.w-id,.w-s,.w-l,.w-st,.w-o,.w-c{width:auto}.gantt{grid-template-columns:110px minmax(0,1fr)}.board{grid-template-columns:minmax(0,1fr)}.col{min-height:0}.hsn{font-size:52px}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band top"><div class="wrap">
  <div class="bar1">
    <span class="brand">Pathline</span>
    <input id="pname" aria-label="שם הפרויקט">
    <span id="pnameRO" class="pn" hidden></span>
    <label class="lbl" id="asWrap"><span id="asLbl">צפייה בתור</span><select id="as" aria-label="צפייה בתור"></select></label>
    <button class="btn" id="bellBtn" aria-label="התראות ותזכורות">התראות <span class="badge" id="badge"></span></button>
    <button class="btn p" id="copBtn">קופיילוט</button>
    <button class="btn" id="undo" title="ביטול הפעולה האחרונה">ביטול</button>
  </div>
  <p class="demo" id="demo" hidden></p>
  <h1 id="h1">טוען…</h1>
  <p class="sub" id="sub"></p>
  <div class="kpis" id="kpis"></div>
  <nav class="tabs" id="tabs" aria-label="תצוגות"></nav>
</div></header>
<main class="band"><div class="wrap" id="main"></div></main>
<footer class="band" style="padding-top:0"><div class="wrap" id="foot">Pathline – ניהול פרויקטים לצוות: נתיב קריטי, לוח אישי לכל עובד, תמונת מצב למנהל וקופיילוט. נבנה על ידי מיקי בייזרמן.</div></footer>
<div id="modal"></div>
<div id="bell" class="pop card" hidden></div>
<aside id="cop" class="drawer" hidden aria-label="קופיילוט">
  <div class="dh"><div><b>קופיילוט הפרויקט</b><div class="note" id="copNote"></div></div><button class="x" id="copClose" aria-label="סגירה">×</button></div>
  <div id="copLog"></div>
  <div id="copChips"></div>

  while(q.length){const id=q.shift();order.push(id);for(const s of succ.get(id)){indeg.set(s,indeg.get(s)-1);if(!indeg.get(s))q.push(s)}}
  if(order.length<T.length){const o=new Set(order);return{cycle:T.filter(t=>!o.has(t.id)).map(t=>t.id),r:new Map(),end:0,deps,order:[]}}
  const by=new Map(T.map(t=>[t.id,t])),r=new Map();let end=0;
  for(const id of order){const es=Math.max(0,...deps.get(id).map(d=>r.get(d).ef)),ef=es+D(by.get(id));r.set(id,{es,ef});end=Math.max(end,ef)}
  for(const id of [...order].reverse()){const s=succ.get(id),o=r.get(id);o.lf=s.length?Math.min(...s.map(x=>r.get(x).ls)):end;o.ls=o.lf-D(by.get(id));o.slack=o.ls-o.es;o.crit=o.slack===0}
  return{r,end,deps,cycle:null,order};
}
function calc(){
  resetWD();
  const C=cpm(),T=S.tasks,ok=T.length&&!C.cycle,tIdx=idxOf(TODAY),info=new Map();
  let wSum=0,wDone=0,wPlan=0;
  for(const t of T){const r=C.r.get(t.id);if(!r){info.set(t.id,{});continue}
    const d=dur(t),done=t.status==='done',prog=done?100:t.progress;
    const pf=d?clamp((tIdx-r.es)/d,0,1):(tIdx>=r.es?1:0);
    const waiting=(C.deps.get(t.id)||[]).filter(x=>get('tasks',x)?.status!=='done');
    const overdue=!done&&d>0&&tIdx>=r.ef?tIdx-r.ef+1:0;
    const lateStart=!done&&!overdue&&t.status==='todo'&&tIdx>r.es;
    const behind=!overdue&&t.status==='doing'&&prog+20<pf*100;
    const dueIn=done?null:(r.ef-1)-tIdx;
    const stale=(t.status==='doing'||t.status==='blocked')&&t.updatedAt&&Date.now()-t.updatedAt>3*DAY?Math.floor((Date.now()-t.updatedAt)/DAY):0;
    info.set(t.id,{...r,d,prog,pf,waiting,overdue,lateStart,behind,dueIn,stale,startsNow:t.status==='todo'&&r.es===tIdx});
    wSum+=d;wDone+=d*prog/100;wPlan+=d*pf}
  // forecast
  let fEnd=0;const fc=new Map();
  if(ok){for(const id of C.order){const t=get('tasks',id),r=C.r.get(id),dm=Math.max(0,...C.deps.get(id).map(x=>fc.get(x))),d=dur(t);let ef;
    if(t.status==='done')ef=Math.min(r.ef,tIdx);else if(t.status==='todo')ef=Math.max(r.es,tIdx,dm)+d;else ef=Math.max(tIdx,dm)+Math.ceil(d*(1-t.progress/100));
    fc.set(id,ef);fEnd=Math.max(fEnd,ef)}}
  const pctDone=wSum?Math.round(wDone/wSum*100):0,pctPlan=wSum?Math.round(wPlan/wSum*100):0,delay=ok?Math.max(0,fEnd-C.end):0;
  // health
  const I=t=>info.get(t.id)||{},drv=[];
  const cnt=f=>T.filter(t=>f(t,I(t))).length;
  const oc=cnt((t,i)=>i.overdue&&i.crit),on=cnt((t,i)=>i.overdue&&!i.crit),bl=cnt(t=>t.status==='blocked'),bh=cnt((t,i)=>i.behind),st=cnt((t,i)=>i.stale);
  const openR=S.risks.filter(r=>r.status!=='Closed'),hiPath=openR.filter(r=>r.p*r.i>=15&&r.taskId!=null&&C.r.get(r.taskId)?.crit&&get('tasks',r.taskId)?.status!=='done');
  if(oc)drv.push([`${plural(oc,'משימה קריטית','משימות קריטיות')} באיחור`,oc*12]);
  if(delay)drv.push([`צפי לאיחור של ${plural(delay,'יום','ימים')} בסיום`,Math.min(30,delay*3)]);
  if(bl)drv.push([plural(bl,'משימה תקועה','משימות תקועות'),bl*8]);
  if(on)drv.push([`${plural(on,'משימה','משימות')} באיחור מחוץ לנתיב הקריטי`,on*5]);
  if(bh)drv.push([`${plural(bh,'משימה מתקדמת','משימות מתקדמות')} לאט מהמתוכנן`,bh*4]);
  if(st)drv.push([`${plural(st,'משימה','משימות')} בלי עדכון יותר משלושה ימים`,st*3]);
  if(hiPath.length)drv.push([`${plural(hiPath.length,'סיכון גבוה','סיכונים גבוהים')} בנתיב הקריטי`,hiPath.length*5]);
  const score=ok?clamp(100-drv.reduce((a,d)=>a+d[1],0),0,100):0;
  const health={score,drivers:drv,label:score>=75?'במסלול':score>=50?'דורש תשומת לב':'בסיכון',cls:score>=75?'':score>=50?'mid':'bad'};
  // per member stats
  const mstat={};
  for(const m of S.members){const mt=T.filter(t=>t.ownerId===m.id),ws=mt.reduce((a,t)=>a+dur(t),0);
    const lastMsg=Math.max(0,...S.msgs.filter(x=>x.from===m.id).map(x=>x.at)),lastSu=Math.max(0,...S.standups.filter(s=>s.memberId===m.id).map(s=>s.at));
    mstat[m.id]={n:mt.length,open:mt.filter(t=>t.status!=='done').length,over:mt.filter(t=>I(t).overdue).length,blocked:mt.filter(t=>t.status==='blocked').length,
      pct:ws?Math.round(mt.reduce((a,t)=>a+dur(t)*(t.status==='done'?100:t.progress),0)/ws):0,
      last:Math.max(0,lastMsg,lastSu,...mt.map(t=>t.updatedAt||0)),su:S.standups.some(s=>s.memberId===m.id&&s.date===TODAY)}}
  return{C,ok,tIdx,info,pctDone,pctPlan,fEnd,delay,health,mstat,openR,hiPath};
}

const tl=t=>`#${t.id} ${t.name}`;
function reminders(K){
  const out=[],R=role(),I=t=>K.info.get(t.id)||{};
  if(!K.ok)return out;
  if(R.r==='mgr'){
    for(const t of S.tasks){const i=I(t),own=mname(t.ownerId);
      if(t.status==='blocked')out.push({lvl:'high',text:`${tl(t)} תקועה (${own})${t.blockReason?': '+t.blockReason:''}`,taskId:t.id,req:1});
      else if(i.overdue)out.push({lvl:i.crit?'high':'med',text:`${tl(t)} באיחור של ${plural(i.overdue,'יום','ימים')} (${own})${i.crit?'. המשימה בנתיב הקריטי.':''}`,taskId:t.id,req:1});
      else if(i.lateStart)out.push({lvl:'med',text:`${tl(t)} הייתה אמורה להתחיל ב־${fmt(i.es)}${i.waiting.length?' ומחכה ל־'+i.waiting.map(x=>'#'+x).join(', '):''} (${own})`,taskId:t.id,req:!i.waiting.length});
      else if(i.behind)out.push({lvl:'med',text:`${tl(t)} מתקדמת לאט: ${i.prog}% מתוך ${Math.round(i.pf*100)}% מתוכנן (${own})`,taskId:t.id,req:1});
      if(i.stale&&t.status!=='blocked')out.push({lvl:'med',text:`${tl(t)} לא עודכנה ${plural(i.stale,'יום','ימים')} (${own})`,taskId:t.id,req:1})}
    for(const f of S.followups)if(!f.done&&f.due<=TODAY)out.push({lvl:f.due<TODAY?'high':'med',text:`מעקב${f.due<TODAY?' שעבר מועדו':' להיום'}: ${f.text}`,taskId:f.taskId,fu:f.id});
    for(const s of S.standups)if(s.b&&s.date>=iso(addDays(today0(),-3)))out.push({lvl:'high',text:`חסם מהעדכון היומי של ${mname(s.memberId)}: ${s.b}`,memberId:s.memberId});
    for(const r of K.hiPath)out.push({lvl:'med',text:`סיכון גבוה בנתיב הקריטי: ${r.title}`,taskId:r.taskId});
  }else if(R.r==='member'){
    for(const t of S.tasks.filter(x=>x.ownerId===R.id)){const i=I(t);
      if(i.overdue)out.push({lvl:'high',text:`${tl(t)} באיחור של ${plural(i.overdue,'יום','ימים')}. עדכנו את המנהל מה צריך כדי לסגור.`,taskId:t.id});
      else if(i.dueIn===0)out.push({lvl:'high',text:`${tl(t)} צריכה להסתיים היום.`,taskId:t.id});
      else if(i.dueIn===1)out.push({lvl:'med',text:`${tl(t)} צריכה להסתיים מחר.`,taskId:t.id});
      if((i.lateStart||i.startsNow)&&!i.waiting.length)out.push({lvl:'med',text:`הגיע הזמן להתחיל את ${tl(t)}.`,taskId:t.id});
      if(i.stale)out.push({lvl:'med',text:`לא עדכנת את ${tl(t)} כבר ${plural(i.stale,'יום','ימים')}.`,taskId:t.id})}
    if(wset.has(today0().getDay())&&!S.standups.some(s=>s.memberId===R.id&&s.date===TODAY))out.push({lvl:'med',text:'עוד לא מילאת את העדכון היומי.',go:'standup'});
  }

}

function removeTasks(ids){const set=new Set(ids),depsOf=new Map(S.tasks.map(t=>[t.id,t.deps.slice()]));

  for(const t of S.tasks.slice()){if(set.has(t.id))continue;if(t.deps.some(d=>set.has(d))){const nd=[...new Set(t.deps.flatMap(d=>resolve(d)))].filter(d=>d!==t.id);put('tasks',{...t,deps:nd})}}
  for(const id of ids)del('tasks',id);
  for(const r of S.risks)if(set.has(r.taskId))put('risks',{...r,taskId:null});
  for(const id of ids)sel.delete(id);if(set.has(wi.id))wi.id=null}

    const base=mode==='replace'?0:nid(S.tasks)-1,keep=new Set(pick),map=new Map();pick.forEach((i,k)=>map.set(i+1,base+k+1));
    const resolve=(n,seen=new Set())=>{if(keep.has(n-1))return[map.get(n)];if(seen.has(n))return[];seen.add(n);return (T.tasks[n-1]?.[2]||[]).flatMap(d=>resolve(d,seen))};

let sampleFn=null,sampleTried=false,busy=false;

function greet(){const R=role();return R.r==='member'?`היי ${mname(R.id)}! אני מכיר את כל הפרויקט: המשימות שלך, הדדליינים וההודעות. אפשר לשאול אותי על מה להתמקד, איך לפרק משימה או איך לנסח עדכון למנהל.`:`היי ${S.meta.manager}! אני מכיר את התוכנית, הצוות, ההתקדמות והסיכונים. שאלו אותי מה המצב, מי צריך עזרה או מה כדאי לעשות היום.`}
function drawChips(){const c=$('#copChips');if(!c||$('#cop').hidden)return;const R=role();

function md(t){let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const lines=h.split('\n');let out='',inL=false;
  for(const l of lines){const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inL){out+='<ul>';inL=true}out+=`<li>${m[1]}</li>`}else{if(inL){out+='</ul>';inL=false}out+=l?l+'<br>':'<br>'}}

    catch(err){a.t=(err&&err.code==='rate_limited'?'הגעתי למגבלת השימוש לרגע. בינתיים, תשובה מתוך הנתונים:\n\n':err&&err.code==='not_granted'?'':'')+localAnswer(q);if(err&&err.code==='not_granted'){sampleFn=null;drawChips()}}}
  else{await new Promise(r=>setTimeout(r,250));a.t=localAnswer(q)}
  a.pending=false;busy=false;drawChat()}

  return L.join('\n')}
function buildPrompt(q){const hist=chat.filter(m=>!m.pending&&m.t).slice(0,-1).slice(-10).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));

  if(has('היום','להתמקד','לעשות','לטפל','עדיפות')){const rem=reminders(K).slice(0,5);return rem.length?`**סדר עדיפויות להיום:**\n${rem.map((r,i)=>`- ${i+1}. ${r.text}`).join('\n')}\n\n${R.r==='mgr'?'טיפ: התחילו מהחסמים. כל יום שמשימה קריטית תקועה הוא יום שהפרויקט מאחר.':'טיפ: עדכון קצר למנהל על מה שמתעכב חוסך הרבה שאלות.'}`:'אין כרגע תזכורות פתוחות. זה זמן טוב לקדם משימה שמתחילה בקרוב או לחשוב על סיכונים.'}
  if(has('מצב','סטטוס','סיכום','איך הולך')){const H=K.health;return `**תמונת מצב:**\n- בריאות: ${H.score} (${H.label})\n- הושלמו ${K.pctDone}% מול ${K.pctPlan}% מתוכנן\n- צפי סיום: ${fmtY(lastDay(0,K.fEnd))}${K.delay?` (${plural(K.delay,'יום','ימים')} אחרי התוכנית)`:''}\n${H.drivers.map(d=>`- ${d[0]}`).join('\n')}\n\n${K.delay?'כדי לחזור למסלול: להסיר חסמים במשימות הקריטיות ולבדוק במצב ״מה אם״ איזה קיצור מחזיר הכי הרבה ימים.':'הפרויקט במסלול. שווה לעבור על הסיכונים הגבוהים.'}`}
  return `אפשר לשאול אותי למשל:\n- מה המצב בפרויקט?\n- ${R.r==='mgr'?'מי מאחר ולמה?':'על מה להתמקד היום?'}\n- מה בסיכון?\n- מה הנתיב הקריטי?\n- שאלה על משימה מסוימת, לפי שם או מספר (למשל #5)\n\nבמצב הדגמה אני עונה מתוך נתוני הפרויקט. בגרסת הצוות בתוך Claude אני עונה חופשי על כל שאלה.`}

/* ---------- shared mode bootstrap ---------- */
(async()=>{
  if(!(window.claude&&window.claude.use))return;
  try{
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    getSample().then(drawChips);
    if(!d||!u)return;
    db=d;userCap=u;isOwner=!!(await u.isOwner());myUid=await u.id();
    try{const cw=await u.can('data.write');if(cw===false)readOnly=true}catch(e){}
    MODE='shared';S=norm(emptyState());hist=[];$('#h1').textContent='טוען את הפרויקט…';$('#main').innerHTML='<p class="note">טוען נתונים משותפים…</p>';
    let first=0;const need=COLLS.length+1,timer=setTimeout(()=>{loaded=true;render();toast('הנתונים עדיין לא נטענו במלואם. ייתכן שהם לא מעודכנים.')},10000);
    const seen=new Set();const mark=(k,snap)=>{if(!snap.metadata.fromCache&&!seen.has(k)){seen.add(k);if(seen.size>=need){clearTimeout(timer);loaded=true}}};
    db.doc('meta/project').onSnapshot(s=>{S.meta=nMeta(s.exists?s.data():null);if(!s.exists)S.meta=emptyState().meta;mark('meta',s);scheduleRender()},e=>{clearTimeout(timer);toast('לא הצלחנו לטעון את הפרויקט.')});
    for(const c of COLLS)db.collection(c).onSnapshot(q=>{S[c]=q.docs.map(x=>NORM[c]({...x.data()})).filter(Boolean);mark(c,q);scheduleRender()},e=>{clearTimeout(timer)});
    render();
  }catch(e){}
})();

/* ---------- start ---------- */
try{const h=location.hash.slice(1);if(h)tab=h}catch(e){}
render();
}
